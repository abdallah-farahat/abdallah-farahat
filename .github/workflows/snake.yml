
# BONUS / OPTIONAL — an animated snake that "eats" your contribution graph.
#
# SETUP:
# 1. In your abdallah-farahat/abdallah-farahat repo, create the folder path
#    .github/workflows/  and put this file inside it (rename to snake.yml).
# 2. Go to repo Settings → Actions → General → Workflow permissions →
#    select "Read and write permissions" → Save.
# 3. Go to the Actions tab → run "generate animated snake" manually once
#    (or just push a commit — it also runs daily on its own).
# 4. Once it finishes, uncomment the snake <img> line near the bottom of
#    README.md — it will point at the branch this workflow creates.

name: generate animated snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: abdallah-farahat
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
